name: Añadir título indicado por Edu
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: catalog-edits
  cancel-in-progress: false
jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Añadir:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/add_from_issue.py
      - run: python -m unittest discover -s tests -v
      - name: Guardar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Añadir título indicado por el propietario'
            git pull --rebase origin main
            git push origin main
          fi
          gh workflow run pages.yml --ref main
          gh issue close "$ISSUE_NUMBER" --comment 'Título incorporado al catálogo. La publicación de GitHub Pages está en curso; la ficha externa y la portada pueden completarse después con cualquier LLM.'
        # Only trusted owner issues run this job. User text is never evaluated by the shell.
        # The issue number comes from the event through the script, not from issue text.
